<style>
:root{--bone:#F0EDE6;--gold:#C9A84C;--dark-bg:#0E0E0C;--border-gold:rgba(201,168,76,0.14);--font-display:'Playfair Display',Georgia,serif;--font-mono:'Space Mono',monospace;--nav-h:90px;--tr:0.25s ease}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--dark-bg);color:var(--bone);font-family:var(--font-mono);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

#nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;display:flex;align-items:center;background:rgba(10,10,9,0.45);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 1px 0 var(--border-gold)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 32px;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:32px}
.nav-logo-wrap{display:flex;align-items:center;line-height:0}
.nav-logo-wrap img{display:block;height:28px;width:auto}
.nav-links{display:flex;align-items:center;justify-content:center;gap:40px;list-style:none}
.nav-links a{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(240,237,230,.45);transition:color var(--tr)}
.nav-links a:hover{color:rgba(240,237,230,.9)}
.nav-right{display:flex;justify-content:flex-end}
.nav-cta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,168,76,.35);padding:10px 22px;transition:var(--tr);white-space:nowrap}
.nav-cta:hover{background:rgba(201,168,76,.08);border-color:var(--gold)}
@media(max-width:768px){.nav-links{display:none}.nav-inner{grid-template-columns:1fr auto}}

.beams{position:absolute;inset:0;pointer-events:none;z-index:-2;overflow:hidden}
.beam{position:absolute;top:-30%;height:160%;width:200px;background:linear-gradient(180deg,rgba(201,168,76,0) 0%,rgba(201,168,76,.14) 45%,rgba(201,168,76,.14) 55%,rgba(201,168,76,0) 100%);filter:blur(34px);mix-blend-mode:screen;opacity:.55;transform:rotate(var(--brot,12deg));animation:beamsway var(--bdur,34s) ease-in-out infinite alternate;animation-delay:var(--bdelay,0s)}
@keyframes beamsway{0%{transform:rotate(var(--brot,12deg)) translateX(0)}100%{transform:rotate(var(--brot,12deg)) translateX(var(--bshift,60px))}}
.particles{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.p{position:absolute;bottom:-10px;width:5px;height:5px;background:var(--gold);transform:rotate(45deg);opacity:0;animation-name:pfloat;animation-duration:var(--dur,18s);animation-delay:var(--delay,0s);animation-timing-function:ease-in;animation-iteration-count:infinite;animation-fill-mode:both}
@keyframes pfloat{0%{transform:rotate(45deg) translateY(0) translateX(0);opacity:0}5%{opacity:var(--op,.18)}85%{opacity:var(--op,.18)}100%{transform:rotate(45deg) translateY(-110vh) translateX(var(--drift,20px));opacity:0}}

.err{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;padding:calc(var(--nav-h) + 48px) 32px 64px;text-align:center;overflow:hidden}
.err-inner{position:relative;z-index:2;max-width:560px}
.err-code{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:28px;display:flex;align-items:center;justify-content:center;gap:12px}
.err-code::before,.err-code::after{content:'';display:block;width:28px;height:1px;background:var(--gold)}
.err-headline{font-family:var(--font-display);font-size:clamp(3rem,7vw,5.5rem);font-weight:700;line-height:1;letter-spacing:-.025em;color:var(--bone);margin-bottom:24px}
.err-headline em{color:var(--gold);font-style:italic}
.err-copy{font-family:var(--font-mono);font-size:13px;line-height:1.9;color:rgba(240,237,230,.55);max-width:440px;margin:0 auto 40px}
.err-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:14px 28px;border:1px solid currentColor;cursor:pointer;transition:var(--tr);background:transparent}
.btn-primary{background:var(--gold);color:var(--dark-bg);border-color:var(--gold)}
.btn-primary:hover{background:#dbb95c;border-color:#dbb95c}
.btn-ghost{color:rgba(240,237,230,.7);border-color:rgba(240,237,230,.2)}
.btn-ghost:hover{background:rgba(240,237,230,.05);border-color:rgba(240,237,230,.5);color:var(--bone)}
.btn svg{width:13px;height:13px;transition:transform var(--tr);flex-shrink:0}
.btn:hover svg{transform:translateX(3px)}

@media(prefers-reduced-motion:reduce){.beam{animation:none}.p{animation:none}}
</style>
